<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1340" viewBox="0 0 1360 1340"><rect width="100%" height="100%" fill="#f7faf8"/><g font-family="PingFang SC,Arial,sans-serif"><text x="40" y="55" font-size="36" fill="#263f3a" font-weight="bold">模板改良候选 B · 取景与标志需求图</text><text x="40" y="95" font-size="23" fill="#9b492e" font-weight="normal">设计草案，尚无新皮肤几何；不覆盖 commons-axilla-v1 / 1.0.0</text><rect x="40" y="135" width="1280" height="270" rx="12" fill="#fff" stroke="#c5d6d0"/><text x="62" y="171" font-size="24" fill="#263f3a" font-weight="bold">缺失肩部的实际影响</text><text x="65" y="200" font-size="23" fill="#263f3a" font-weight="normal">现有模板足以指认局部圈选，但缺少稳定的肩/肘/胸壁标志，限制跨姿态配准和神经边界复核。</text><text x="65" y="243" font-size="23" fill="#263f3a" font-weight="normal">补一个“圆肩膀”不能解决依据不足。优先要求同一姿态下可见肩峰/肩臂连接、肘内侧和胸壁定位线索。</text><text x="65" y="286" font-size="23" fill="#263f3a" font-weight="normal">扩展需有许可的新源或专业插画；抬臂角度、视向、遮挡、左右与个体差异由审核者确定。</text><text x="65" y="329" font-size="23" fill="#263f3a" font-weight="normal">当前只设计取景要求；下方灰区不是待计算皮肤，更不表示解剖尺度或具体位置。</text><rect x="80" y="455" width="750" height="620" rx="12" fill="#e9efec" stroke="#9eaaa5" stroke-dasharray="12 8"/><text x="110" y="495" font-size="23" fill="#263f3a" font-weight="normal">候选取景范围（示意，不是新人体轮廓）</text><svg xmlns="http://www.w3.org/2000/svg" width="400" height="360" viewBox="0 0 400 360" x="210" y="600"><title>axilla-right: surface-only derivative of Roquex CC0 photograph; no neural boundaries</title><g transform=""><g transform="matrix(.42 0 0 .42 10 30)"><path id="skin" d="M 100 20 L 590 20 C 645 83 716 161 777 223 C 811 257 841 287 880 310 L 880 650 L 410 650 C 391 601 375 547 362 495 C 349 443 335 393 308 353 C 270 294 233 237 199 184 C 160 124 126 64 100 20 Z" fill="#efe1d3" stroke="#78675f" stroke-width="3.2" stroke-linejoin="round" /><path d="M100 20 H590 M880 310 V650 H410" fill="none" stroke="#efe1d3" stroke-width="5" /><path id="crop-seams" d="M100 20 H590 M880 310 V650 H410" fill="none" stroke="#bca99b" stroke-width="2.2" stroke-dasharray="10 9" /><g fill="none" stroke="#ac9181" stroke-width="2.6" stroke-linecap="round"><path id="anterior-fold" d="M 590 20 C 606 80 596 154 617 211 C 630 251 614 290 591 322" /><path id="posterior-fold" d="M 308 353 C 368 370 419 344 468 304 C 511 269 546 236 567 211" /><path id="axillary-floor" d="M 430 375 C 478 350 527 319 565 278" /><path id="lower-crease" d="M 466 405 C 518 379 561 344 588 308" /></g></g></g></svg><text x="280" y="995" font-size="21" fill="#263f3a" font-weight="normal">旧窗口仅作上下文定位示例</text><text x="865" y="520" font-size="23" fill="#263f3a" font-weight="normal">新增参考标志清单</text><text x="865" y="569" font-size="23" fill="#263f3a" font-weight="normal">□肩峰及肩臂连接</text><text x="865" y="618" font-size="23" fill="#263f3a" font-weight="normal">□近端上臂至内侧肘部</text><text x="865" y="667" font-size="23" fill="#263f3a" font-weight="normal">□前/后腋褶完整走向</text><text x="865" y="716" font-size="23" fill="#263f3a" font-weight="normal">□胸壁肋间或其他可验证标志</text><text x="865" y="765" font-size="23" fill="#263f3a" font-weight="normal">□统一抬臂姿态、左右原侧证据</text><text x="865" y="814" font-size="23" fill="#263f3a" font-weight="normal">□前后斜视是否需分别取景</text><text x="80" y="1140" font-size="22" fill="#263f3a" font-weight="normal">候选 A（左右审核图）：保留旧400×360皮肤和原坐标，仅添加独立审核标记。</text><text x="80" y="1180" font-size="22" fill="#263f3a" font-weight="normal">候选 B：只记录新增模板的取景规范。新模板若采用，必须新ID/版本；旧标注留在旧模板，</text><text x="80" y="1220" font-size="22" fill="#263f3a" font-weight="normal">不能用整体缩放、自动镜像或按相同归一化坐标无提示迁移。需专门配准与人工复核。</text><text x="80" y="1260" font-size="22" fill="#263f3a" font-weight="normal">审核选择：□ A足够支持限定范围  □ 先制作B  □ 两者均否决。理由：_________________</text></g></svg>