<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1080"><rect width="100%" height="100%" fill="white"/><g font-family="PingFang SC, sans-serif" font-size="17" fill="#233b34"><text x="24" y="38" font-size="27">Goran 可见表面覆盖矩阵（源图能力，不是临床准确率）</text><text x="24" y="72">A 明确可提取　B 部分可见　C 独立边界不足　D 遮挡　E 未确认</text><rect x="20" y="100" width="1260" height="42" fill="#fff0d0"/><text x="30" y="128">头面部</text><text x="270" y="128">B</text><text x="350" y="128" font-size="15">主图前V1/V2/V3、C2；后V1/C2；侧头插图V1/V2/V3、C2–C5</text><rect x="20" y="145" width="1260" height="42" fill="#fff0d0"/><text x="30" y="173">颈部</text><text x="270" y="173">B</text><text x="350" y="173" font-size="15">前C2/C3/C4；后C2/C3/C4等可见过渡</text><rect x="20" y="190" width="1260" height="42" fill="#fff0d0"/><text x="30" y="218">肩部</text><text x="270" y="218">B</text><text x="350" y="218" font-size="15">前C4/C5/C6；后C4/C5/C6/C7/C8过渡</text><rect x="20" y="235" width="1260" height="42" fill="#d8eee3"/><text x="30" y="263">胸部</text><text x="270" y="263">A</text><text x="350" y="263" font-size="15">源前T1–T6附近实际路径，非固定高度公式</text><rect x="20" y="280" width="1260" height="42" fill="#d8eee3"/><text x="30" y="308">腹部</text><text x="270" y="308">A</text><text x="350" y="308" font-size="15">源前T7–T12及L1过渡</text><rect x="20" y="325" width="1260" height="42" fill="#d8eee3"/><text x="30" y="353">背部</text><text x="270" y="353">A</text><text x="350" y="353" font-size="15">后T1–T12，L1/L2过渡</text><rect x="20" y="370" width="1260" height="42" fill="#fff0d0"/><text x="30" y="398">上臂</text><text x="270" y="398">B</text><text x="350" y="398" font-size="15">源C5/C6、后C7/C8；胸段过渡按原图</text><rect x="20" y="415" width="1260" height="42" fill="#fff0d0"/><text x="30" y="443">前臂</text><text x="270" y="443">B</text><text x="350" y="443" font-size="15">源C5、C6–8、C8/T1、T1/T2等组合</text><rect x="20" y="460" width="1260" height="42" fill="#f8dfce"/><text x="30" y="488">手背</text><text x="270" y="488">C</text><text x="350" y="488" font-size="15">C6–8与C8/T1组合，可见指甲</text><rect x="20" y="505" width="1260" height="42" fill="#f8dfce"/><text x="30" y="533">手掌</text><text x="270" y="533">C</text><text x="350" y="533" font-size="15">掌心、五指掌侧真实可见；主要C6–8、C8/T1</text><rect x="20" y="550" width="1260" height="42" fill="#fff0d0"/><text x="30" y="578">手指掌侧/背侧</text><text x="270" y="578">B/C</text><text x="350" y="578" font-size="15">掌纹、指腹与背侧指甲可辨；标签为组合</text><rect x="20" y="595" width="1260" height="42" fill="#d8eee3"/><text x="30" y="623">腰臀部</text><text x="270" y="623">A/B</text><text x="350" y="623" font-size="15">后L1/L2、S2/S3/S4/S5；中央C1字样含义不明</text><rect x="20" y="640" width="1260" height="42" fill="#fff0d0"/><text x="30" y="668">腹股沟</text><text x="270" y="668">B</text><text x="350" y="668" font-size="15">L1/L2及前会阴S3/S4</text><rect x="20" y="685" width="1260" height="42" fill="#d8eee3"/><text x="30" y="713">大腿前后面及内侧</text><text x="270" y="713">A/B</text><text x="350" y="713" font-size="15">前L2/L3；后L2/L3、S2/S3等可见片</text><rect x="20" y="730" width="1260" height="42" fill="#d8eee3"/><text x="30" y="758">小腿</text><text x="270" y="758">A/B</text><text x="350" y="758" font-size="15">L3/L4/L5及后S2等真实路径</text><rect x="20" y="775" width="1260" height="42" fill="#d8eee3"/><text x="30" y="803">足背</text><text x="270" y="803">A</text><text x="350" y="803" font-size="15">前L4/L5/S1</text><rect x="20" y="820" width="1260" height="42" fill="#d8eee3"/><text x="30" y="848">足底</text><text x="270" y="848">A/B</text><text x="350" y="848" font-size="15">后L5/S1明确封闭面；L4/S2仅近端踝缘</text><rect x="20" y="865" width="1260" height="42" fill="#fff0d0"/><text x="30" y="893">脚趾</text><text x="270" y="893">B</text><text x="350" y="893" font-size="15">前足趾背侧、后趾腹；后L5/S1</text><rect x="20" y="910" width="1260" height="42" fill="#fff0d0"/><text x="30" y="938">腋下</text><text x="270" y="938">B/D</text><text x="350" y="938" font-size="15">前T1/T2近腋缘有色区</text><rect x="20" y="955" width="1260" height="42" fill="#fff0d0"/><text x="30" y="983">会阴</text><text x="270" y="983">B/D/E</text><text x="350" y="983" font-size="15">前S3/S4；后S3/S4/S5；C1字样歧义</text><text x="24" y="1050" font-size="15">证据：原始前/后SVG，具体Path与限制见02-full-body-coverage.md。未显示不等于无神经分布。</text></g></svg>