# Future business routes. Include inside the TLS server only after approval.
# No public token issuance, invitation issuance, debug, docs, or readiness.
location ~ ^/api/v1/(evaluate(/body-intersection)?|ai/sessions(/[a-f0-9]{32}(/(photo|segment|edit|confirm|assets/[A-Za-z0-9_.-]+))?)?)$ {
    limit_except GET POST DELETE { deny all; }
    limit_req zone=dermatome_https_api burst=12 nodelay;
    limit_req_status 429;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8001;
}
