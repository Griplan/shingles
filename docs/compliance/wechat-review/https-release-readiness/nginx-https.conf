# Stage 2. Enable only after the certificate is issued and verified.
# Load inside http via sites-enabled. This vhost starts in health-only mode.
limit_req_zone $binary_remote_addr zone=dermatome_https_api:1m rate=2r/s;

server {
    listen 443 ssl;
    server_name dermatome.bglabs.cloud;

    ssl_certificate /etc/letsencrypt/live/dermatome.bglabs.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dermatome.bglabs.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    error_log /var/log/nginx/dermatome-https-error.log crit;
    add_header Cache-Control "no-store, private" always;
    client_max_body_size 10m;
    client_body_timeout 15s;
    send_timeout 65s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Test-Access-Key "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-AI-Session-Key $http_x_ai_session_key;
    proxy_connect_timeout 3s;
    proxy_send_timeout 65s;
    proxy_read_timeout 65s;

    location = /api/v1/health {
        limit_except GET { deny all; }
        limit_req zone=dermatome_https_api burst=12 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
    }

    # Keep disabled until the backend rejects public-test credentials for
    # production, the app uses approved auth, and release tests pass.
    # include /etc/nginx/snippets/dermatome-https-api.conf;

    location / { return 404; }
}
