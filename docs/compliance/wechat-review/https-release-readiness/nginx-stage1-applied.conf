server {
    listen 80;
    listen [::]:80;
    server_name dermatome.bglabs.cloud;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dermatome-acme;
        try_files $uri =404;
    }

    location / {
        return 308 https://dermatome.bglabs.cloud$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dermatome.bglabs.cloud;

    ssl_certificate /etc/letsencrypt/live/dermatome.bglabs.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dermatome.bglabs.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    add_header Cache-Control "no-store" always;
    client_max_body_size 1k;

    location = /api/v1/health {
        limit_except GET { deny all; }
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Host $server_name;
        proxy_set_header Content-Length "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_pass http://127.0.0.1:8001/api/v1/health;
    }

    location / { return 404; }
}
