limit_req_zone $binary_remote_addr zone=dermatome_formal:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name dermatome.bglabs.cloud;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dermatome-acme;
        try_files $uri =404;
    }

    location / {
        return 308 https://dermatome.bglabs.cloud$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dermatome.bglabs.cloud;

    ssl_certificate /etc/letsencrypt/live/dermatome.bglabs.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dermatome.bglabs.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    add_header Cache-Control "no-store" always;
    client_max_body_size 1k;

    location = /api/v1/health {
        limit_except GET { deny all; }
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Host $server_name;
        proxy_set_header Content-Length "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_pass http://127.0.0.1:8001/api/v1/health;
    }

    # Photo upload is the only formal route allowed to receive more than 2 MiB.
    location ~ "^/api/v1/ai/sessions/[a-f0-9]{32}/photo$" {
        client_max_body_size 51m;
        client_body_timeout 15s;
        limit_req zone=dermatome_formal burst=12 nodelay;
        limit_req_status 429;

        rewrite ^(/api/v1/.*)$ /internal/production$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_pass_request_headers on;
        proxy_set_header Host $server_name;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Test-Access-Key "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-AI-Session-Key $http_x_ai_session_key;
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        add_header Cache-Control "no-store, private" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ "^/api/v1/(?:access/wechat|evaluate(?:/body-intersection)?|ai/sessions(?:/[a-f0-9]{32}(?:/(?:segment|edit|confirm|assets/[A-Za-z0-9_.-]{1,100}))?)?)$" {
        client_max_body_size 2m;
        client_body_timeout 15s;
        limit_req zone=dermatome_formal burst=12 nodelay;
        limit_req_status 429;

        rewrite ^(/api/v1/.*)$ /internal/production$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_pass_request_headers on;
        proxy_set_header Host $server_name;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Test-Access-Key "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-AI-Session-Key $http_x_ai_session_key;
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        add_header Cache-Control "no-store, private" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / { return 404; }
}
