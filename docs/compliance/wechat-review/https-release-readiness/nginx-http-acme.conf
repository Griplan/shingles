# Stage 1. Enable only after DNS and server changes are approved.
# Leave enabled for certificate renewal when adding the separate TLS vhost.
server {
    listen 80;
    server_name dermatome.bglabs.cloud;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dermatome-acme;
        try_files $uri =404;
    }

    location / { return 404; }
}
