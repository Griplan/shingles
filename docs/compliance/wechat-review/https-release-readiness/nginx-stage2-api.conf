# Include inside the existing TLS server, after the formal auth gate is configured.
# Define dermatome_formal: limit_req_zone $binary_remote_addr zone=dermatome_formal:1m rate=2r/s;
location ~ "^/api/v1/(?:access/wechat|evaluate(?:/body-intersection)?|ai/sessions(?:/[a-f0-9]{32}(?:/(?:photo|segment|edit|confirm|assets/[A-Za-z0-9_.-]{1,100}))?)?)$" {
    client_max_body_size 10m;
    client_body_timeout 15s;
    limit_req zone=dermatome_formal burst=12 nodelay;
    limit_req_status 429;

    rewrite ^(/api/v1/.*)$ /internal/production$1 break;
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_pass_request_headers on;
    proxy_set_header Host $server_name;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Test-Access-Key "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-AI-Session-Key $http_x_ai_session_key;
    proxy_connect_timeout 3s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    add_header Cache-Control "no-store, private" always;
}
