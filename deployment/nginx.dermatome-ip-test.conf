# Temporary public-IP HTTP test only. No patient data. Original A configuration stays untouched.
limit_req_zone $binary_remote_addr zone=dermatome_ip_test:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=dermatome_ip_connections:1m;
server {
    listen 80;
    listen [::]:80;
    server_name 212.64.26.206;
    client_max_body_size 10m;

    # B test namespace only. No public operator key; existing Bearer + photo ownership remain required.
    location ^~ /dermatome-test/api/v1/ {
        limit_req zone=dermatome_ip_test burst=12 nodelay;
        limit_req_status 429;
        limit_conn dermatome_ip_connections 6;
        limit_conn_status 429;
        client_max_body_size 11m;
        client_body_timeout 15s;
        send_timeout 65s;
        access_log off;
        proxy_pass http://127.0.0.1:8001/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Test-Access-Key "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-AI-Session-Key $http_x_ai_session_key;
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_request_buffering off;
        proxy_intercept_errors on;
        error_page 502 504 =503 @dermatome_unavailable;
        add_header Cache-Control "no-store, private" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /dermatome-test { return 404; }
    location /dermatome-test/ { return 404; }
    location @dermatome_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Service temporarily unavailable"}}';
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
