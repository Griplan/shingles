[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "dermatome-mapper-backend"
version = "0.0.0"
description = "带状疱疹神经皮节辅助定位系统 V0 后端骨架"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "shapely>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ai-service = ["python-multipart>=0.0.20,<0.1"]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
